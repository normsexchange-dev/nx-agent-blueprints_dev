name: Validate blueprints

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact annotated blueprint release to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check out immutable communications dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: normsexchange-dev/nx-codex-communications_dev
          ref: communications-v0.6.0
          path: .dependency-checkouts/communications
          fetch-depth: 0
          fetch-tags: true
      - name: Check out immutable sourcing-contract dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: normsexchange-dev/nx-sourcing-contracts_dev
          ref: contract-v0.2.0
          path: .dependency-checkouts/contract
          fetch-depth: 0
          fetch-tags: true
      - name: Check out immutable public Gemini review source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: normsexchange-gemini/nx-gemini-communications_dev
          ref: snapshot-post-alignment
          path: .dependency-checkouts/gemini-snapshot
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate deterministic blueprint foundation
        shell: bash
        env:
          NX_INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          NX_VALIDATION_BRANCH: ${{ inputs.release_tag || github.head_ref || github.ref_name }}
        run: |
          release_tag="${NX_INPUT_RELEASE_TAG}"
          if [[ -z "${release_tag}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then release_tag="${GITHUB_REF_NAME}"; fi
          if [[ -n "${release_tag}" ]]; then git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"; fi
          git -C .dependency-checkouts/communications fetch --force origin refs/tags/communications-v0.6.0:refs/tags/communications-v0.6.0
          git -C .dependency-checkouts/contract fetch --force origin refs/tags/contract-v0.2.0:refs/tags/contract-v0.2.0
          git -C .dependency-checkouts/gemini-snapshot fetch --force origin refs/tags/snapshot-pre-alignment:refs/tags/snapshot-pre-alignment refs/tags/snapshot-post-alignment:refs/tags/snapshot-post-alignment
          node scripts/validate-blueprints.mjs --branch "${NX_VALIDATION_BRANCH}"
          node scripts/verify-dependency-tags.mjs --communications .dependency-checkouts/communications --contract .dependency-checkouts/contract
          node scripts/verify-foreign-snapshot.mjs --repository .dependency-checkouts/gemini-snapshot
          node --test tests/*.test.mjs
          if [[ -n "${release_tag}" ]]; then node scripts/validate-release.mjs --tag "${release_tag}"; fi
